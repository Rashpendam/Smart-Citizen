<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Citizen Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header>🛡️ National Smart Citizen Registration</header>
    <div class="content-section">
      <h2>Step 1: Enter Profile Details</h2>
      <p class="instruction">Enter your details below to generate your live digital exhibition stamp card pass.</p>
      
      <!-- Standard HTML Form processing handles data routing automatically across all mobile screens -->
      <form action="dashboard.html" method="GET">
        <div class="local-input-group">
          <input type="text" name="name" placeholder="Type Your Full Name" required>
          <input type="text" name="class" placeholder="Type Your Class" required>
          <input type="text" name="section" placeholder="Type Your Section" required>
          <button type="submit">Activate My Passport Card 🚀</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
